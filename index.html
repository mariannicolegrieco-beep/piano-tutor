<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Tutor Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Libreria gratuita professionale per veri spartiti musicali -->
  <script src="opensheetmusicdisplay.min.js"></script>
</head>
<body>
    <div id="schermata-login" style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px;">
  <div style="background:#1e293b;padding:28px;border-radius:14px;width:100%;max-width:380px;color:white;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
    <h2 style="margin-top:0;text-align:center;">🎹 Piano Tutor</h2>
    <p id="msg-auth" style="color:#f87171;font-size:14px;text-align:center;min-height:20px;"></p>
    <div id="campo-nome" style="display:none;margin-bottom:12px;">
      <input type="text" id="auth-nome" placeholder="Il tuo Nome" style="width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:12px;">
      <input type="email" id="auth-email" placeholder="Email" style="width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px;">
      <input type="password" id="auth-password" placeholder="Password" style="width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box;">
    </div>
    <button id="btn-invia-auth" style="width:100%;padding:11px;border-radius:8px;border:none;background:#0284c7;color:white;font-weight:bold;cursor:pointer;font-size:15px;">Accedi</button>
    <p style="text-align:center;margin-top:14px;font-size:13px;color:#94a3b8;">
      <span id="testo-switch-auth">Non hai un account?</span>
      <a href="#" id="link-switch-auth" style="color:#38bdf8;font-weight:bold;">Registrati</a>
    </p>
  </div>
</div>

    <header class="barra-superiore">
        <h1>🎹 Piano Tutor</h1>
        <div class="controlli">
            <label for="input-spartito" class="pulsante" style="cursor: pointer;">📂 Carica Spartito</label>
            <input type="file" id="input-spartito" accept=".xml,.musicxml,.mxl" style="display: none;">
            <select id="selectBranoPronto" class="pulsante" title="Scegli un brano pronto" style="cursor: pointer;">  
                <option value="innoAllaGioia">🎵 Inno alla Gioia</option>
                <option value="minuettoBach">🎵 Minuetto in Sol</option>
                <option value="perElisa">🎵 Per Elisa (Tema)</option>
            </select>
          <button id="btnEliminaBrano" class="pulsante" title="Rimuovi questo brano salvato dall'elenco" style="display: none; padding: 6px 9px; background: #991b1b;">🗑️</button>
            <div class="pulsante" style="display: inline-flex; align-items: center; gap: 5px; cursor: default;">
                <span>⏱️</span>
                <input type="range" id="sliderVelocita" min="40" max="160" value="100" style="width: 65px; cursor: pointer;">
                <span id="testoBpm" style="min-width: 52px;">100 BPM</span>
            </div>

            <button id="btnMetronomo" class="pulsante" title="Attiva/Disattiva Metronomo">🥁 Metro: OFF</button>

            <button id="btn-play" class="pulsante primario">▶️ Avvia</button>
            <button id="btn-indietro" class="pulsante" title="Nota precedente">⏮️ -1</button>
            <button id="btn-avanti" class="pulsante" title="Nota successiva">⏭️ +1</button>
            <button id="btn-reset" class="pulsante">🔄 Inizio</button>
            <button id="btn-mani" class="pulsante">👐 Mani: Entrambe</button>
            <button id="btn-vista" class="pulsante">📖 Vista: Completa</button>
            <button id="btn-midi" class="pulsante">🔌 MIDI</button>
            <button id="btn-mic" class="pulsante">🎙️ Mic</button>
            <span id="stato-connessione" class="stato">Pronto</span>
            <a id="btn-pannello-admin" href="https://pythonanywhere.com" target="_blank" class="pulsante" style="display:none;background:#7c3aed;text-decoration:none;">👑 Utenti</a>
          <button id="btn-logout-piano" class="pulsante" style="background:#475569;">Esci</button>          
        </div>
    </header>

    <main id="area-principale" class="area-principale">
        <div id="area-spartito" class="area-spartito">
            <div id="osmd-container" class="osmd-container"></div>
        </div>

        <div id="contenitore-cascata" class="contenitore-cascata">
            <canvas id="canvas-cascata"></canvas>
            <div id="messaggio-guida" class="messaggio-guida">
                Premi <strong>Avvia</strong> per suonare il brano di prova oppure carica un file <strong>MusicXML (.xml / .mxl)</strong>!
            </div>
        </div>

        <div class="contenitore-tastiera">
            <div id="tastiera" class="tastiera"></div>
        </div>
    </main>

    <script src="brano.js"></script>
    <script src="app.js"></script>
</body>
</html>
